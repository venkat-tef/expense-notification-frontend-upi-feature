  <script>
  /*
   * Restore the saved Nestly theme BEFORE Angular starts.
   *
   * This is intentionally tiny and only restores the page background/
   * browser/PWA theme color early enough for iOS standalone mode.
   *
   * ThemeService remains the single source of truth after Angular boots.
   */
  (() => {
    try {
      const themeId = localStorage.getItem('nestly-theme-id');

      const backgrounds = {
        'nestly-classic': '#f7f8fa',
        'ocean-glass': '#f2f8fb',
        'forest': '#f4f8f2',
        'sunset': '#fff8f2',
        'lavender': '#f9f6fc',
        'midnight': '#141816'
      };

      const background =
        backgrounds[themeId] || backgrounds['nestly-classic'];

      const root = document.documentElement;

root.style.setProperty('--rm-bg', background);
root.style.backgroundColor = background;

const themeColorMeta =
  document.querySelector<HTMLMetaElement>('meta[name="theme-color"]');

if (themeColorMeta) {
  themeColorMeta.setAttribute('content', background);
}
} catch {
      // Keep the existing default startup appearance if storage is unavailable.
    }
  })();
</script>
