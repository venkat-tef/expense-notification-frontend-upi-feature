<h2 mat-dialog-title>{{ isEdit ? 'Edit Member' : 'Add Member' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="rm-dialog-content">
    <mat-form-field appearance="outline" class="rm-full">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" autocomplete="off" />
    </mat-form-field>

    @if (!isEdit) {
      <mat-form-field appearance="outline" class="rm-full">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="off" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="rm-full">
        <mat-label>Temporary password</mat-label>
        <input matInput type="password" formControlName="tempPassword" autocomplete="new-password" />
        <mat-hint>They can change this after logging in.</mat-hint>
      </mat-form-field>
    }

    <mat-form-field appearance="outline" class="rm-full">
      <mat-label>Phone (optional)</mat-label>
      <input matInput formControlName="phone" autocomplete="off" />
    </mat-form-field>

    <div class="rm-dialog-row">
      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option value="admin">Admin</mat-option>
          <mat-option value="member">Member</mat-option>
           <mat-option value="guest">Guest</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="active">Active</mat-option>
          <mat-option value="inactive">Inactive</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
      @if (saving()) { <mat-icon class="rm-spin">progress_activity</mat-icon> } @else { {{ isEdit ? 'Save' : 'Add Member' }} }
    </button>
  </mat-dialog-actions>
</form>
