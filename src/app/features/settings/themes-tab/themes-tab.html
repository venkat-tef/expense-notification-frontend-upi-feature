<div class="rm-fade-in">
  <p class="rm-section-title" style="margin-top:0">Choose your theme</p>
  <p class="rm-themes-hint">
    Pick a look that matches your style. It applies instantly and stays saved on this device.
  </p>
  <app-theme-picker />
</div>
<br/>

    <div class="rm-card rm-config-card">
    <div class="rm-config-card__head">
      <span class="rm-config-card__icon rm-config-card__icon--active"><mat-icon>notifications_active</mat-icon></span>
      <div>
        <p class="rm-config-card__title">Push Notifications</p>
        <p class="rm-config-card__desc">{{ notifStatusText() }}</p>
      </div>
    </div>

    @if (notifPermission() !== 'granted' && notifPermission() !== 'unsupported') {
      <button
        mat-flat-button
        color="primary"
        class="rm-add-member-btn"
        [disabled]="enabling()"
        (click)="enableNotifications()">
        {{ enabling() ? 'Enabling…' : 'Enable Notifications' }}
      </button>
    }
  </div>
