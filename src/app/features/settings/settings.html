<div class="rm-page rm-fade-in">
  <header class="rm-mod-header">
    <span class="rm-mod-header__icon rm-mod-header__icon--settings">
      <mat-icon>settings</mat-icon>
    </span>
    <div>
      <h1>Settings</h1>
      <p>Customize your Nestly experience</p>
    </div>
  </header>

  <nav class="rm-tab-bar" role="tablist">
    @for (tab of tabs(); track tab.id) {
      <button
        type="button"
        role="tab"
        class="rm-tab-btn"
        [class.rm-tab-btn--active]="activeTab() === tab.id"
        [attr.aria-selected]="activeTab() === tab.id"
        (click)="selectTab(tab.id)"
      >
        <mat-icon>{{ tab.icon }}</mat-icon>
        <span>{{ tab.label }}</span>
      </button>
    }
  </nav>

  <div class="rm-tab-panel">
    @switch (activeTab()) {
      @case ('members') { <app-members-tab /> }
      @case ('announcements') { <app-announcements-tab /> }
      @case ('configuration') { <app-configuration-tab /> }
      @case ('themes') { <app-themes-tab /> }
    }
  </div>
</div>
