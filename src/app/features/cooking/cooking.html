<div class="rm-page rm-fade-in">
  <header class="rm-mod-header">
    <span class="rm-mod-header__icon" [style.background]="accent">
      <mat-icon>delete</mat-icon>
    </span>

    <div>
      <h1>Garbage Collection</h1>
      <p>Tap any day to mark who collected.</p>
    </div>
  </header>

  <div class="rm-card rm-cal-wrap">
    <app-task-calendar
      [members]="memberService.members()"
     [records]="calendarRecords"
      [accentColor]="accent"
      (daySelected)="onDaySelected($event)"
    />
  </div>

  @if (nextMember) {
    <section
      class="rm-duty-reference"
      [class.rm-duty-reference--completed]="dutyCompletedToday"
      aria-label="Garbage duty roommate scene"
    >
      <!-- Dynamic roommate artwork -->
      <div class="rm-duty-reference__scene">
        <img
          [src]="dutySceneSrc"
          [alt]="nextMember.name + ' garbage duty scene'"
          class="rm-duty-reference__art"
        />
      </div>

      <!-- Dynamic duty message -->
      <div class="rm-duty-reference__message">
        <span
          class="rm-duty-reference__megaphone"
          aria-hidden="true"
        >
          📣
        </span>

        <div>
          <strong>
            {{ nextMember.name }}'s turn today!
          </strong>

          <p>
            @if (dutyCompletedToday) {
              Duty completed! The rota continues 😂
            } @else {
              Even garbage deserves a hero... today it's
              {{ nextMember.name }}! 😂
            }
          </p>
        </div>
      </div>

      <!-- Existing collection action -->
      <button
        type="button"
        class="rm-duty-reference__collect"
        [disabled]="dutyCompletedToday"
        (click)="markTodayCollected()"
      >
        <span class="rm-duty-reference__check">
          ✓
        </span>

        {{ dutyCompletedToday
          ? 'Collected'
          : 'Mark as Collected'
        }}
      </button>
    </section>
  }
</div>
